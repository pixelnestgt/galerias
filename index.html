<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Galería · Pixel Nest</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f2ee; --paper:#fbfaf8; --ink:#161616; --muted:#7a766f; --line:#e3dfd8;
    --dark:#0e0e0e; --gap:14px; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:500}

  /* ---------- Loader / estados ---------- */
  .state{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px;text-align:center}
  .state h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1.05}
  .state p{color:var(--muted);max-width:420px;line-height:1.6;font-size:14px}
  .spinner{width:34px;height:34px;border:1.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lock form{display:flex;gap:0;border:1px solid var(--ink);margin-top:8px}
  .lock input{border:0;background:transparent;padding:14px 16px;font:inherit;font-size:14px;width:240px;outline:none}
  .lock button{background:var(--ink);color:#fff;padding:0 22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
  .lock .err{color:#a33;font-size:13px;min-height:18px}

  /* ---------- Hero ---------- */
  .hero{position:relative;height:100vh;min-height:520px;overflow:hidden;background:var(--dark);color:#fff}
  .hero-img{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);opacity:0;transition:opacity 1.4s ease,transform 6s ease}
  .hero-img.ready{opacity:1;transform:scale(1)}
  .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,.05) 35%,rgba(0,0,0,.15) 60%,rgba(0,0,0,.62) 100%)}
  .hero-top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:28px clamp(20px,4vw,48px)}
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand b{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.02em}
  .brand span{font-size:9.5px;letter-spacing:.32em;text-transform:uppercase;opacity:.8;margin-top:3px}
  .hero-body{position:absolute;z-index:2;left:clamp(20px,4vw,48px);right:clamp(20px,4vw,48px);bottom:clamp(40px,8vh,80px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .hero-body h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,7.5vw,104px);line-height:.95;letter-spacing:-.01em;max-width:14ch}
  .hero-body .eyebrow{opacity:.85;margin-bottom:18px}
  .hero-meta{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;text-align:right;line-height:2}
  .scroll-cue{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.7);padding:13px 22px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;margin-top:14px;transition:background .3s,color .3s}
  .scroll-cue:hover{background:#fff;color:var(--ink)}

  /* ---------- Barra ---------- */
  .bar{position:sticky;top:0;z-index:20;background:rgba(244,242,238,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar-in{display:flex;align-items:center;gap:24px;padding:14px clamp(20px,4vw,48px)}
  .bar .brand b{font-size:18px}
  .bar .brand span{font-size:8.5px}
  .tabs{display:flex;gap:22px;overflow-x:auto;flex:1;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding:6px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
  .tabs a:hover,.tabs a.on{color:var(--ink);border-color:var(--ink)}
  .actions{display:flex;gap:10px;margin-left:auto}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);padding:10px 16px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;transition:background .2s,color .2s}
  .btn:hover,.btn.solid{background:var(--ink);color:#fff}
  .btn.solid:hover{background:#333}
  .btn svg{width:14px;height:14px}
  .fav-count{display:inline-block;min-width:18px;text-align:center}

  /* ---------- Galería ---------- */
  main{padding:clamp(36px,6vw,80px) clamp(12px,3vw,40px) 40px}
  .intro{max-width:760px;margin:0 auto clamp(40px,6vw,80px);text-align:center}
  .intro p{font-family:var(--serif);font-size:clamp(20px,2.4vw,27px);line-height:1.45;color:#3a3833;font-style:italic}
  .intro .eyebrow{color:var(--muted);margin-top:20px;display:block}
  section.sec{margin-bottom:clamp(56px,8vw,110px);scroll-margin-top:80px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:0 4px 18px;margin-bottom:22px;border-bottom:1px solid var(--line)}
  .sec-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.4vw,42px)}
  .sec-head .eyebrow{color:var(--muted)}
  .grid{display:flex;gap:var(--gap);align-items:flex-start}
  .col{flex:1;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
  .tile{position:relative;overflow:hidden;background:#e9e6e0;cursor:zoom-in}
  .tile img{display:block;width:100%;height:auto;min-height:120px;opacity:0;transition:opacity .7s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
  .tile img.ok{opacity:1;min-height:0}
  .tile:hover img{transform:scale(1.025)}
  .tile .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .tile .play i{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
  .tile .play svg{width:22px;height:22px;fill:#fff;margin-left:4px}
  .heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s}
  .heart svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:1.6}
  .tile:hover .heart,.heart.on{opacity:1;transform:none}
  .heart.on svg{fill:var(--ink)}
  @media (hover:none){.heart{opacity:1;transform:none;background:rgba(255,255,255,.75)}}

  footer{border-top:1px solid var(--line);padding:56px clamp(20px,4vw,48px) 64px;display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap}
  footer .brand b{font-size:26px}
  footer .links{display:flex;gap:22px;flex-wrap:wrap}
  footer .links a{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  footer .links a:hover{color:var(--ink)}
  footer small{display:block;color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.6;max-width:420px}

  /* ---------- Lightbox ---------- */
  .lb{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.97);color:#fff;display:none;flex-direction:column}
  .lb.open{display:flex}
  .lb-top,.lb-bottom{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,3vw,32px);gap:16px;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  .lb-top .name{opacity:.55;letter-spacing:.08em;text-transform:none;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-tools{display:flex;gap:6px}
  .lb-tools button,.lb-tools a{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .2s}
  .lb-tools button:hover,.lb-tools a:hover{background:rgba(255,255,255,.1)}
  .lb-tools svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:1.5}
  .lb-tools .on svg{fill:#fff}
  .lb-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 clamp(8px,6vw,90px)}
  .lb-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;transition:opacity .35s}
  .lb-stage img.loading{opacity:.25}
  .lb-stage iframe{width:min(100%,1400px);aspect-ratio:16/9;max-height:100%;border:0;background:#000}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;display:flex;align-items:center;justify-content:center;opacity:.6;transition:opacity .2s}
  .lb-nav:hover{opacity:1}
  .lb-nav svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:1.2}
  .lb-prev{left:clamp(4px,1.5vw,20px)} .lb-next{right:clamp(4px,1.5vw,20px)}
  .lb-bottom{justify-content:center;opacity:.6}
  @media (max-width:640px){.lb-nav{display:none}}

  /* ---------- Panel de selección ---------- */
  .drawer{position:fixed;inset:0;z-index:90;display:none}
  .drawer.open{display:block}
  .drawer .shade{position:absolute;inset:0;background:rgba(0,0,0,.35)}
  .drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.12)}
  .panel header{display:flex;justify-content:space-between;align-items:center;padding:24px 26px;border-bottom:1px solid var(--line)}
  .panel header h3{font-family:var(--serif);font-weight:400;font-size:28px}
  .panel .thumbs{flex:1;overflow:auto;padding:18px 26px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
  .panel .thumbs div{position:relative;aspect-ratio:1;background:#e9e6e0 center/cover}
  .panel .thumbs button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);font-size:13px;line-height:22px}
  .panel .empty{grid-column:1/-1;color:var(--muted);font-size:14px;line-height:1.6;padding:20px 0}
  .panel .send{padding:20px 26px 26px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
  .panel textarea{width:100%;min-height:84px;border:1px solid var(--line);background:#fff;padding:12px;font:inherit;font-size:14px;resize:vertical;outline:none}
  .panel textarea:focus{border-color:var(--ink)}
  .panel .send .btn{justify-content:center;padding:15px}
  .panel .msg{font-size:13px;color:var(--muted);min-height:18px;text-align:center}

  /* ---------- Selección para descargar ---------- */
  .check{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;pointer-events:none}
  .check svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.6;opacity:0}
  .sel-mode .check{display:flex}
  .sel-mode .tile{cursor:pointer}
  .sel-mode .heart{display:none}
  .tile.picked .check{background:var(--ink)}
  .tile.picked .check svg{opacity:1}
  .tile.picked img{transform:scale(.93)}
  .tile.picked{background:#d9d5cd}
  .selbar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,160%);z-index:60;background:var(--ink);color:#fff;display:flex;align-items:center;gap:2px;padding:6px 6px 6px 18px;box-shadow:0 12px 40px rgba(0,0,0,.28);transition:transform .3s ease;width:max-content;max-width:calc(100% - 20px)}
  .selbar.show{transform:translate(-50%,0)}
  .selbar .count{font-size:13px;margin-right:10px;white-space:nowrap}
  .selbar button{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:12px 12px;color:#fff;white-space:nowrap}
  .selbar button.primary{background:#fff;color:var(--ink)}
  .selbar button:disabled{opacity:.4}
  .progress{position:fixed;inset:0;z-index:150;background:rgba(244,242,238,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
  .progress.show{display:flex}
  .progress h3{font-family:var(--serif);font-weight:400;font-size:30px}
  .progress p{color:var(--muted);font-size:14px;line-height:1.6;max-width:380px}
  .progress .barwrap{width:min(320px,80vw);height:2px;background:var(--line)}
  .progress .barfill{height:100%;width:0;background:var(--ink);transition:width .25s}
  .progress .vids{display:flex;flex-direction:column;gap:8px}
  @media (max-width:560px){ .selbar{left:10px;right:10px;width:auto;transform:translateY(160%)} .selbar.show{transform:none} .selbar .count{margin-right:auto} }

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:200}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .drawer.open ~ .toast{bottom:auto;top:24px}

  @media (max-width:760px){
    .bar .brand{display:none}
    .actions .label{display:none}
    .hero-meta{text-align:left}
  }
</style>
</head>
<body>
<div id="app"><div class="state"><div class="spinner"></div></div></div>

<div class="lb" id="lb" aria-hidden="true">
  <div class="lb-top">
    <span class="name" id="lbName"></span>
    <div class="lb-tools">
      <button id="lbFav" title="Agregar a mi selección"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.3A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.6c0 5.7-7.5 10.3-7.5 10.3z"/></svg></button>
      <button id="lbDl" title="Descargar"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg></button>
      <button id="lbClose" title="Cerrar (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></svg></button>
    <div id="lbMedia" style="display:contents"></div>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
  </div>
  <div class="lb-bottom"><span id="lbCount"></span></div>
</div>

<div class="drawer" id="drawer">
  <div class="shade" data-close></div>
  <div class="panel">
    <header><h3>Mi selección</h3><button data-close class="btn" style="padding:8px 12px">Cerrar</button></header>
    <div class="thumbs" id="selThumbs"></div>
    <div class="send">
      <textarea id="selNote" placeholder="¿Algún comentario? (opcional) — por ejemplo, para qué uso son estas fotos."></textarea>
      <button class="btn solid" id="selSend">Enviar selección</button>
      <div class="msg" id="selMsg"></div>
    </div>
  </div>
</div>

<div class="selbar" id="selbar">
  <span class="count" id="pickCount">0 seleccionadas</span>
  <button id="pickAll">Todas</button>
  <button class="primary" id="pickDl" disabled>Descargar</button>
  <button id="pickCancel" aria-label="Salir de selección">✕</button>
</div>

<div class="progress" id="progress">
  <h3 id="progTitle">Preparando descarga</h3>
  <div class="barwrap"><div class="barfill" id="progFill"></div></div>
  <p id="progText"></p>
  <div class="vids" id="progVids"></div>
  <button class="btn" id="progClose" style="display:none">Cerrar</button>
</div>

<div class="toast" id="toast"></div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxzsFO9DG1lEti2jWPodGxYJhhvqxkMZ2mnO9_WVTUbKEczRmCLDv0_e7PSfe4L8WbQ/exec';
var BOOT = {
  slug: (new URLSearchParams(location.search).get('g') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 80),
  brand: 'Pixel Nest',
  brandSub: 'Architectural Media',
  website: 'https://www.pixelnest-rem.com',
  instagram: '',
  whatsapp: ''
};

(function(){
  'use strict';
  var state = { data:null, flat:[], idx:0, favs:{}, pw:'' };
  var app = document.getElementById('app');

  /* ---------- Utilidades ---------- */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function img(id, w){ return (window.DEMO_IMG ? window.DEMO_IMG(id, w) : 'https://lh3.googleusercontent.com/d/' + id + '=w' + w); }
  function imgAlt(id, w){ return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + w; }
  function dl(id){ return 'https://drive.google.com/uc?export=download&id=' + id; }
  function store(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
  function sstore(k, v){ try{ if(v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); }catch(e){ return null; } }
  function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2400); }
  function call(fn, args){
    if (window.DEMO_API) return new Promise(function(resolve){ setTimeout(function(){ resolve(window.DEMO_API(fn, args)); }, 350); });
    var body = fn === 'sendSelection'
      ? { action: 'select', g: args[0], pw: args[1], ids: args[2], note: args[3] }
      : { action: 'get', g: args[0], pw: args[1] };
    // Anónimo a propósito: sin cookies de Google, así no falla con varias cuentas iniciadas.
    return fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function fallback(el, id, w){ el.onerror = function(){ if (!el.dataset.fb){ el.dataset.fb = '1'; el.src = imgAlt(id, w); } }; }
  var ICON = {
    heart:'<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.3A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.6c0 5.7-7.5 10.3-7.5 10.3z"/></svg>',
    dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>',
    play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/></svg>',
    tick:'<svg viewBox="0 0 24 24"><path d="m5.5 12.5 4.2 4.2 8.8-9"/></svg>'
  };

  /* ---------- Carga ---------- */
  function load(pw){
    if (!BOOT.slug) return renderState('Galería no encontrada', 'Revisa el enlace que recibiste o escríbenos y te lo reenviamos.');
    call('getGallery', [BOOT.slug, pw || '']).then(function(d){
      if (d.error === 'not_found') return renderState('Galería no disponible', 'Este enlace no existe o la galería ya no está activa. Escríbenos y con gusto te ayudamos.');
      if (d.error) return renderState('No pudimos cargar la galería', 'Intenta de nuevo en unos minutos.');
      if (d.locked) return renderLock(d);
      state.pw = pw || '';
      if (pw) sstore('pn_pw_' + BOOT.slug, pw);
      state.data = d;
      document.title = (d.project || d.client || 'Galería') + ' · ' + BOOT.brand;
      state.favs = store('pn_fav_' + BOOT.slug) || {};
      render();
    }).catch(function(){ renderState('No pudimos cargar la galería', 'Revisa tu conexión e intenta de nuevo.'); });
  }

  function brandHtml(){ return '<div class="brand"><b>' + esc(BOOT.brand) + '</b><span>' + esc(BOOT.brandSub) + '</span></div>'; }

  function renderState(title, text){
    app.innerHTML = '<div class="state">' + brandHtml() + '<h1>' + esc(title) + '</h1><p>' + esc(text) + '</p>' + contactLinks() + '</div>';
  }

  function renderLock(d){
    app.innerHTML = '<div class="state lock">' + brandHtml() +
      '<span class="eyebrow" style="color:var(--muted)">' + esc(d.client || 'Galería privada') + '</span>' +
      '<h1>' + esc(d.project || 'Galería privada') + '</h1>' +
      '<p>Esta galería es privada. Ingresa la contraseña que te compartimos.</p>' +
      '<form id="lockForm"><input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" autofocus><button>Entrar</button></form>' +
      '<div class="err">' + (d.wrong ? 'Contraseña incorrecta.' : '') + '</div></div>';
    document.getElementById('lockForm').onsubmit = function(e){
      e.preventDefault();
      var v = document.getElementById('pw').value.trim();
      if (!v) return;
      app.querySelector('.err').textContent = 'Verificando…';
      load(v);
    };
  }

  function contactLinks(){
    var l = [];
    if (BOOT.website) l.push('<a href="' + esc(BOOT.website) + '" target="_blank" rel="noopener">Sitio web</a>');
    if (BOOT.instagram) l.push('<a href="https://instagram.com/' + esc(BOOT.instagram) + '" target="_blank" rel="noopener">Instagram</a>');
    if (BOOT.whatsapp) l.push('<a href="https://wa.me/' + esc(BOOT.whatsapp) + '" target="_blank" rel="noopener">WhatsApp</a>');
    return l.length ? '<div class="links">' + l.join('') + '</div>' : '';
  }

  /* ---------- Render principal ---------- */
  function render(){
    var d = state.data;
    state.flat = [];
    d.sections.forEach(function(s, si){ s.items.forEach(function(it){ it._sec = si; it._i = state.flat.length; state.flat.push(it); }); });
    var multi = d.sections.length > 1 || (d.sections[0] && d.sections[0].title);

    var h = '';
    h += '<header class="hero"><div class="hero-img" id="heroImg"></div>';
    h += '<div class="hero-top">' + brandHtml() + '</div>';
    h += '<div class="hero-body"><div>';
    if (d.client) h += '<div class="eyebrow">' + esc(d.client) + '</div>';
    h += '<h1>' + esc(d.project || d.client || 'Galería') + '</h1>';
    h += '<a href="#galeria" class="scroll-cue" target="_self">Ver galería</a></div>';
    h += '<div class="hero-meta">' + (d.date ? esc(d.date) + '<br>' : '') + d.total + (d.total === 1 ? ' archivo' : ' archivos') + '</div>';
    h += '</div></header>';

    h += '<div class="bar"><div class="bar-in">' + brandHtml() + '<nav class="tabs">';
    if (multi) d.sections.forEach(function(s, i){ h += '<a href="#sec-' + i + '" target="_self" data-sec="' + i + '">' + esc(s.title || 'Galería') + '</a>'; });
    h += '</nav><div class="actions">';
    if (d.downloads) h += '<button class="btn" id="pickMode">' + ICON.check + '<span class="label">Seleccionar</span></button>';
    h += '<button class="btn" id="openSel">' + ICON.heart.replace('<svg', '<svg fill="none" stroke="currentColor" stroke-width="1.6"') + '<span class="label">Selección</span> <span class="fav-count" id="favCount">0</span></button>';
    if (d.downloads) h += '<button class="btn solid" id="dlAll">' + ICON.dl + '<span class="label">Descargar todo</span></button>';
    h += '</div></div></div>';

    h += '<main id="galeria"><div class="intro"><p>Gracias por confiar en nosotros. Aquí encontrarás el material final de tu proyecto, listo para ver, seleccionar y descargar.</p>';
    h += '<span class="eyebrow">Marca con ♡ tus favoritas y envíanos tu selección</span></div>';
    d.sections.forEach(function(s, i){
      h += '<section class="sec" id="sec-' + i + '">';
      if (multi) h += '<div class="sec-head"><h2>' + esc(s.title || 'Galería') + '</h2><span class="eyebrow">' + s.items.length + '</span></div>';
      h += '<div class="grid" data-sec="' + i + '"></div></section>';
    });
    h += '</main>';

    h += '<footer><div>' + brandHtml() + '<small>Fotografía y video para arquitectura, real estate y hospitality. Todas las imágenes son propiedad de ' + esc(BOOT.brand) + ' y se entregan bajo la licencia de uso acordada.</small></div>' + contactLinks() + '</footer>';

    app.innerHTML = h;

    if (d.cover){
      var hero = document.getElementById('heroImg'), pre = new Image(), w = Math.min(2560, Math.ceil(window.innerWidth * (window.devicePixelRatio || 1) / 400) * 400);
      pre.onload = function(){ hero.style.backgroundImage = 'url("' + pre.src + '")'; hero.classList.add('ready'); };
      pre.onerror = function(){ if (!pre.dataset.fb){ pre.dataset.fb = 1; pre.src = imgAlt(d.cover, w); } };
      pre.src = img(d.cover, w);
    }

    layout(true);
    updateFavUI();
    document.getElementById('openSel').onclick = openDrawer;
    if (d.downloads){
      document.getElementById('pickMode').onclick = function(){ setPickMode(!pickMode); };
      document.getElementById('dlAll').onclick = function(){ downloadMany(state.flat); };
    }
    spyTabs();
  }

  /* Masonry en columnas, respetando el orden de lectura (izq → der) */
  var lastCols = 0;
  function colsFor(){ var w = window.innerWidth; return w < 560 ? 1 : w < 1000 ? 2 : 3; }
  function layout(force){
    var n = colsFor();
    if (!force && n === lastCols) return;
    lastCols = n;
    var dpr = window.devicePixelRatio || 1;
    var w = Math.min(1600, Math.ceil(window.innerWidth / n * dpr / 200) * 200);
    document.querySelectorAll('.grid').forEach(function(grid){
      var s = state.data.sections[+grid.dataset.sec];
      var cols = []; grid.innerHTML = '';
      for (var c = 0; c < n; c++){ var col = document.createElement('div'); col.className = 'col'; grid.appendChild(col); cols.push(col); }
      s.items.forEach(function(it, k){
        var t = document.createElement('figure'); t.className = 'tile'; t.dataset.i = it._i;
        var im = document.createElement('img'); im.loading = 'lazy'; im.alt = it.name; im.decoding = 'async';
        im.onload = function(){ im.classList.add('ok'); };
        fallback(im, it.id, w); im.src = img(it.id, w);
        t.appendChild(im);
        if (it.type === 'video'){ var p = document.createElement('div'); p.className = 'play'; p.innerHTML = '<i>' + ICON.play + '</i>'; t.appendChild(p); }
        var hb = document.createElement('button'); hb.className = 'heart' + (state.favs[it.id] ? ' on' : ''); hb.title = 'Agregar a mi selección'; hb.innerHTML = ICON.heart;
        hb.onclick = function(e){ e.stopPropagation(); toggleFav(it.id); };
        t.appendChild(hb);
        var ck = document.createElement('span'); ck.className = 'check'; ck.innerHTML = ICON.tick; t.appendChild(ck);
        if (picked[it.id]) t.classList.add('picked');
        t.onclick = function(){ if (pickMode) togglePick(it.id); else openLb(it._i); };
        cols[k % n].appendChild(t);
      });
    });
  }
  var rT; window.addEventListener('resize', function(){ clearTimeout(rT); rT = setTimeout(function(){ if (state.data) layout(false); }, 150); });

  function spyTabs(){
    if (!('IntersectionObserver' in window)) return;
    var links = document.querySelectorAll('.tabs a');
    if (!links.length) return;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if (en.isIntersecting){ var i = en.target.id.split('-')[1]; links.forEach(function(a){ a.classList.toggle('on', a.dataset.sec === i); }); } });
    }, { rootMargin: '-40% 0px -55% 0px' });
    document.querySelectorAll('section.sec').forEach(function(s){ io.observe(s); });
  }

  /* ---------- Favoritas ---------- */
  function toggleFav(id){
    if (state.favs[id]) delete state.favs[id]; else state.favs[id] = 1;
    store('pn_fav_' + BOOT.slug, state.favs);
    updateFavUI();
    toast(state.favs[id] ? 'Agregada a tu selección' : 'Quitada de tu selección');
  }
  function updateFavUI(){
    var n = Object.keys(state.favs).filter(function(id){ return state.flat.some(function(x){ return x.id === id; }); }).length;
    var c = document.getElementById('favCount'); if (c) c.textContent = n;
    document.querySelectorAll('.tile').forEach(function(t){ var it = state.flat[+t.dataset.i]; t.querySelector('.heart').classList.toggle('on', !!state.favs[it.id]); });
    if (lb.classList.contains('open')) document.getElementById('lbFav').classList.toggle('on', !!state.favs[state.flat[state.idx].id]);
    if (drawer.classList.contains('open')) renderDrawer();
  }

  var drawer = document.getElementById('drawer');
  function openDrawer(){ renderDrawer(); drawer.classList.add('open'); document.getElementById('selMsg').textContent = ''; }
  drawer.addEventListener('click', function(e){ if (e.target.hasAttribute('data-close')) drawer.classList.remove('open'); });
  function renderDrawer(){
    var box = document.getElementById('selThumbs');
    var items = state.flat.filter(function(it){ return state.favs[it.id]; });
    if (!items.length){ box.innerHTML = '<div class="empty">Aún no has marcado favoritas. Toca el ♡ sobre cualquier foto para agregarla aquí.</div>'; return; }
    box.innerHTML = items.map(function(it){ return '<div style="background-image:url(\'' + img(it.id, 300) + '\')" title="' + esc(it.name) + '"><button data-id="' + esc(it.id) + '" aria-label="Quitar">×</button></div>'; }).join('');
    box.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ toggleFav(b.dataset.id); }; });
  }
  document.getElementById('selSend').onclick = function(){
    var ids = state.flat.filter(function(it){ return state.favs[it.id]; }).map(function(it){ return it.id; });
    var msg = document.getElementById('selMsg'), btn = this;
    if (!ids.length){ msg.textContent = 'Marca al menos una foto.'; return; }
    btn.disabled = true; msg.textContent = 'Enviando…';
    call('sendSelection', [BOOT.slug, state.pw, ids, document.getElementById('selNote').value]).then(function(r){
      btn.disabled = false;
      msg.textContent = r && r.ok ? '¡Listo! Recibimos tu selección de ' + r.count + ' archivos.' : 'No se pudo enviar. Intenta de nuevo.';
    }).catch(function(){ btn.disabled = false; msg.textContent = 'No se pudo enviar. Intenta de nuevo.'; });
  };

  /* ---------- Selección y descargas (directo, sin pasar por Drive) ---------- */
  var pickMode = false, picked = {};
  var selbar = document.getElementById('selbar');
  function setPickMode(on){
    pickMode = on; if (!on) picked = {};
    document.body.classList.toggle('sel-mode', on);
    selbar.classList.toggle('show', on);
    updatePickUI();
  }
  function togglePick(id){ if (picked[id]) delete picked[id]; else picked[id] = 1; updatePickUI(); }
  function updatePickUI(){
    var n = Object.keys(picked).length;
    document.querySelectorAll('.tile').forEach(function(t){ t.classList.toggle('picked', !!picked[state.flat[+t.dataset.i].id]); });
    document.getElementById('pickCount').textContent = n + (n === 1 ? ' seleccionada' : ' seleccionadas');
    document.getElementById('pickAll').textContent = n === state.flat.length ? 'Ninguna' : 'Todas';
    document.getElementById('pickDl').disabled = !n;
  }
  document.getElementById('pickAll').onclick = function(){
    if (Object.keys(picked).length === state.flat.length) picked = {};
    else state.flat.forEach(function(it){ picked[it.id] = 1; });
    updatePickUI();
  };
  document.getElementById('pickCancel').onclick = function(){ setPickMode(false); };
  document.getElementById('pickDl').onclick = function(){
    var items = state.flat.filter(function(it){ return picked[it.id]; });
    downloadMany(items);
  };

  function origUrl(id){ return 'https://lh3.googleusercontent.com/d/' + id + '=s0-d'; }
  function directUrl(id){ return 'https://drive.usercontent.google.com/download?id=' + id + '&export=download&confirm=t'; }
  function fetchOriginal(it){
    return fetch(origUrl(it.id), { credentials: 'omit' }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); });
  }
  function saveBlob(blob, name){
    var u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }
  function downloadOne(it){
    if (it.type === 'video'){ window.open(directUrl(it.id), '_blank'); return; }
    toast('Descargando ' + it.name + '…');
    fetchOriginal(it).then(function(b){ saveBlob(b, it.name); }).catch(function(){ window.open(directUrl(it.id), '_blank'); });
  }
  function loadZipLib(){
    if (window.JSZip) return Promise.resolve(window.JSZip);
    return new Promise(function(res, rej){
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
      s.onload = function(){ res(window.JSZip); }; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  var prog = document.getElementById('progress');
  function progress(title, text, pct){
    prog.classList.add('show');
    document.getElementById('progTitle').textContent = title;
    document.getElementById('progText').textContent = text || '';
    document.getElementById('progFill').style.width = (pct || 0) + '%';
  }
  document.getElementById('progClose').onclick = function(){ prog.classList.remove('show'); };
  function finish(title, text, vids){
    progress(title, text, 100);
    var box = document.getElementById('progVids');
    box.innerHTML = (vids || []).map(function(v){ return '<a class="btn" href="' + directUrl(v.id) + '" target="_blank" rel="noopener">' + ICON.dl + ' ' + esc(v.name) + '</a>'; }).join('');
    document.getElementById('progClose').style.display = '';
  }
  function downloadMany(items){
    if (!items.length) return;
    if (items.length === 1) return downloadOne(items[0]);
    var imgs = items.filter(function(i){ return i.type === 'image'; });
    var vids = items.filter(function(i){ return i.type === 'video'; });
    document.getElementById('progClose').style.display = 'none';
    document.getElementById('progVids').innerHTML = '';
    if (!imgs.length) return finish('Videos', 'Toca cada video para descargarlo.', vids);
    var multi = state.data.sections.length > 1, done = 0, failed = 0;
    progress('Preparando descarga', '0 de ' + imgs.length + ' fotos', 0);
    loadZipLib().then(function(JSZip){
      var zip = new JSZip(), queue = imgs.slice(), used = {};
      function worker(){
        var it = queue.shift(); if (!it) return Promise.resolve();
        return fetchOriginal(it).then(function(b){
          var sec = state.data.sections[it._sec].title, path = (multi && sec ? sec + '/' : '') + it.name;
          while (used[path]) path = path.replace(/(\.[^.]+)?$/, '-1$1');
          used[path] = 1; zip.file(path, b, { binary: true });
        }).catch(function(){ failed++; }).then(function(){
          done++; progress('Preparando descarga', done + ' de ' + imgs.length + ' fotos', Math.round(done / imgs.length * 90));
          return worker();
        });
      }
      return Promise.all([worker(), worker(), worker(), worker()]).then(function(){
        progress('Comprimiendo…', 'Un momento, casi listo.', 95);
        return zip.generateAsync({ type: 'blob', compression: 'STORE' });
      }).then(function(blob){
        var name = (state.data.project || state.data.client || BOOT.slug || 'galeria').replace(/[\\/:*?"<>|·]+/g, '').replace(/\s+/g, ' ').trim() + ' - Pixel Nest.zip';
        saveBlob(blob, name);
        if (pickMode) setPickMode(false);
        var msg = 'Se descargó un archivo .zip con ' + (imgs.length - failed) + ' fotos en resolución original.';
        if (failed) msg += ' ' + failed + ' no se pudieron incluir; descárgalas una por una.';
        if (vids.length) msg += ' Los videos se descargan por separado:';
        finish('Descarga lista', msg, vids);
      });
    }).catch(function(){ finish('No se pudo preparar la descarga', 'Revisa tu conexión e intenta de nuevo.', []); });
  }

  /* ---------- Lightbox ---------- */
  var lb = document.getElementById('lb'), media = document.getElementById('lbMedia');
  function openLb(i){ state.idx = i; lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; showLb(); }
  function closeLb(){ lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; media.innerHTML = ''; }
  function showLb(){
    var it = state.flat[state.idx], d = state.data;
    var w = Math.min(2560, Math.ceil(window.innerWidth * (window.devicePixelRatio || 1) / 400) * 400);
    if (it.type === 'video'){
      media.innerHTML = '<iframe src="https://drive.google.com/file/d/' + esc(it.id) + '/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>';
    } else {
      var im = document.createElement('img'); im.alt = it.name; im.className = 'loading';
      im.onload = function(){ im.classList.remove('loading'); };
      fallback(im, it.id, w);
      im.src = img(it.id, w);
      media.innerHTML = ''; media.appendChild(im);
      [state.idx + 1, state.idx - 1].forEach(function(j){ var n = state.flat[j]; if (n && n.type === 'image'){ var p = new Image(); p.src = img(n.id, w); } });
    }
    document.getElementById('lbName').textContent = (d.sections[it._sec].title ? d.sections[it._sec].title + ' · ' : '') + it.name;
    document.getElementById('lbCount').textContent = (state.idx + 1) + ' / ' + state.flat.length;
    document.getElementById('lbFav').classList.toggle('on', !!state.favs[it.id]);
    document.getElementById('lbDl').style.display = d.downloads ? '' : 'none';
  }
  function step(k){ state.idx = (state.idx + k + state.flat.length) % state.flat.length; showLb(); }
  document.getElementById('lbPrev').onclick = function(e){ e.stopPropagation(); step(-1); };
  document.getElementById('lbNext').onclick = function(e){ e.stopPropagation(); step(1); };
  document.getElementById('lbClose').onclick = closeLb;
  document.getElementById('lbDl').onclick = function(){ downloadOne(state.flat[state.idx]); };
  document.getElementById('lbFav').onclick = function(){ toggleFav(state.flat[state.idx].id); };
  document.getElementById('lbStage').addEventListener('click', function(e){ if (e.target.id === 'lbStage') closeLb(); });
  document.addEventListener('keydown', function(e){
    if (!lb.classList.contains('open')) { if (e.key === 'Escape') drawer.classList.remove('open'); return; }
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key.toLowerCase() === 'f') toggleFav(state.flat[state.idx].id);
  });
  var sx = null, sy = null;
  lb.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener('touchend', function(e){
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    else if (dy > 90) closeLb();
    sx = sy = null;
  });

  load(sstore('pn_pw_' + BOOT.slug) || '');
})();
</script>
</body>
</html>
